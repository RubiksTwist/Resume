<svg width="1100" height="560" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">EHS Intel architecture</title>
  <desc id="desc">Agency bulk files feed a nightly ingestion pipeline that loads PostgreSQL. A read-only MCP server with four tools answers from that database, and AI clients reach it over a private tailnet. The earlier Next.js chat interface and FastAPI endpoints were retired.</desc>
  <rect width="1100" height="560" fill="#f7faf9"/>
  <text x="40" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#10251f">EHS Intel Platform Architecture</text>
  <g font-family="Arial" fill="#10251f">
    <rect x="40" y="150" width="210" height="120" rx="10" fill="#e9f3ff" stroke="#9bb8d3"/>
    <text x="60" y="190" font-size="18" font-weight="700">Agency Data</text>
    <text x="60" y="218" font-size="14">OSHA, MSHA, EPA ECHO</text>
    <text x="60" y="240" font-size="14">FRS, TRI, ITA, RMP,</text>
    <text x="60" y="262" font-size="14">Superfund</text>

    <rect x="310" y="150" width="210" height="120" rx="10" fill="#fbeee8" stroke="#d6a48f"/>
    <text x="330" y="190" font-size="18" font-weight="700">Nightly Pipeline</text>
    <text x="330" y="218" font-size="14">03:00 ET, 3 MB/s cap</text>
    <text x="330" y="240" font-size="14">Staging-table swap</text>
    <text x="330" y="262" font-size="14">Run ledger per source</text>

    <rect x="580" y="150" width="210" height="120" rx="10" fill="#fff4df" stroke="#d9b76f"/>
    <text x="600" y="190" font-size="18" font-weight="700">PostgreSQL 16</text>
    <text x="600" y="218" font-size="14">Sites, citations, links</text>
    <text x="600" y="240" font-size="14">Load date per source</text>

    <rect x="850" y="150" width="210" height="120" rx="10" fill="#e8f3ef" stroke="#9ab8ae"/>
    <text x="870" y="190" font-size="18" font-weight="700">MCP Server</text>
    <text x="870" y="218" font-size="14">4 read-only tools</text>
    <text x="870" y="240" font-size="14">Coverage per section</text>

    <rect x="850" y="380" width="210" height="110" rx="10" fill="#f1edf8" stroke="#b1a2cf"/>
    <text x="870" y="420" font-size="18" font-weight="700">AI Client</text>
    <text x="870" y="448" font-size="14">Claude Code or Codex</text>
    <text x="870" y="470" font-size="14">on the owner's machine</text>
    <text x="968" y="335" font-size="14" fill="#52635f">Private tailnet</text>

    <rect x="40" y="380" width="480" height="110" rx="10" fill="none" stroke="#9aa5a2" stroke-dasharray="7 6"/>
    <text x="60" y="420" font-size="18" font-weight="700" fill="#52635f">Retired 2026-11-24</text>
    <text x="60" y="448" font-size="14" fill="#52635f">Next.js streaming chat interface, FastAPI endpoints,</text>
    <text x="60" y="470" font-size="14" fill="#52635f">server-side model calls and the public-API fallback</text>
  </g>
  <g stroke="#52635f" stroke-width="4" fill="none" stroke-linecap="round"><path d="M250 210 H302"/><path d="M520 210 H572"/><path d="M790 210 H842"/><path d="M955 270 V372"/></g>
  <g fill="#52635f"><polygon points="296,200 312,210 296,220"/><polygon points="566,200 582,210 566,220"/><polygon points="836,200 852,210 836,220"/><polygon points="945,366 955,382 965,366"/></g>
</svg>
