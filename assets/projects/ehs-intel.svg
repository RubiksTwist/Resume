<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">EHS Intel Platform architecture preview</title>
  <desc id="desc">A compliance intelligence stack showing source ingestion, PostgreSQL, MCP tools, and a streaming web interface.</desc>
  <rect width="1200" height="760" fill="#f7faf9"/>
  <rect x="70" y="80" width="1060" height="600" rx="18" fill="#ffffff" stroke="#c7d7d2" stroke-width="2"/>
  <text x="110" y="150" fill="#12312b" font-family="Arial, sans-serif" font-size="46" font-weight="700">EHS Intel Platform</text>
  <text x="110" y="198" fill="#5a6f69" font-family="Arial, sans-serif" font-size="24">DB-first compliance intelligence workflow</text>
  <g font-family="Arial, sans-serif" font-size="23" font-weight="700">
    <rect x="110" y="285" width="225" height="110" rx="14" fill="#e8f3ef" stroke="#9ab8ae"/>
    <text x="148" y="350" fill="#12312b">Agency Data</text>
    <rect x="490" y="285" width="225" height="110" rx="14" fill="#fff4df" stroke="#d9b76f"/>
    <text x="532" y="350" fill="#12312b">PostgreSQL</text>
    <rect x="865" y="285" width="225" height="110" rx="14" fill="#e9eef8" stroke="#9daed3"/>
    <text x="910" y="350" fill="#12312b">MCP Tools</text>
    <rect x="490" y="505" width="225" height="110" rx="14" fill="#f1edf8" stroke="#b1a2cf"/>
    <text x="536" y="570" fill="#12312b">Next.js UI</text>
  </g>
  <g stroke="#46625c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M335 340 H490"/>
    <path d="M715 340 H865"/>
    <path d="M978 395 C978 500 760 560 715 560"/>
    <path d="M490 560 C355 555 240 500 223 396"/>
  </g>
  <g fill="#46625c">
    <polygon points="480,330 500,340 480,350"/>
    <polygon points="855,330 875,340 855,350"/>
    <polygon points="722,549 704,560 724,570"/>
    <polygon points="224,407 216,386 238,397"/>
  </g>
  <text x="110" y="455" fill="#5a6f69" font-family="Arial, sans-serif" font-size="22">OSHA, EPA, ITA, TRI, MSHA, and Superfund records are normalized into indexed query paths, then exposed through resolve and brief tools.</text>
</svg>
